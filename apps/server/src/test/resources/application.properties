# ===================================================================
# Test Server Configuration
# ===================================================================
spring.application.name=chat-support-server

# ===================================================================
# Test In-Memory Database (H2 in MySQL mode)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===================================================================
# JPA & Hibernate Settings
# ===================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# ===================================================================
# Performance (Java 25 Virtual Threads)
# ===================================================================
spring.threads.virtual.enabled=true

# ===================================================================
# JWT Settings (Test Credentials)
# ===================================================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# ===================================================================
# CORS Settings
# ===================================================================
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
